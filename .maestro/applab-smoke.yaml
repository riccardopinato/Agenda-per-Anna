appId: com.riccardopinato.agenda_per_anna
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "La tua agenda, davvero tua."
    timeout: 15000
- tapOn: "Inizia"
- tapOn:
    text: '(Oggi|Today|Hoy|Aujourd’hui|Hoje)[\s\S]*'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '(La mia giornata|My day|Mi día|Ma journée|O meu dia)[\s\S]*'
    timeout: 15000
- extendedWaitUntil:
    visible: '(Cattura|Capture|Capturar|Capturer)'
    timeout: 10000
- stopApp
- launchApp
- tapOn:
    text: '(Oggi|Today|Hoy|Aujourd’hui|Hoje)[\s\S]*'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '(La mia giornata|My day|Mi día|Ma journée|O meu dia)[\s\S]*'
    timeout: 15000
- extendedWaitUntil:
    visible: '(Cattura|Capture|Capturar|Capturer)'
    timeout: 10000

# Functional Vault deep journey. FLAG_SECURE intentionally excludes Vault from
# screenshot regression, but setup/unlock/relock/wrong-password/persistence are
# mandatory AppLab runtime gates.
# v1.00-D2 — Private Vault deep functional journey.
# FLAG_SECURE intentionally keeps Vault out of screenshot regression; this flow
# proves functional state transitions and encrypted persistence instead.
#
# Deterministic QA-only fixtures. The AppLab build starts with clearState=true,
# so the Vault MUST begin unconfigured.
- tapOn:
    text: '(Home|Inicio|Accueil|Início)[\s\S]*'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '(La mia agenda|My agenda|Mi agenda|Mon agenda|A minha agenda)'
    timeout: 10000
- tapOn:
    text: '(Impostazioni|Settings|Ajustes|Paramètres|Definições)'
- extendedWaitUntil:
    visible: '(Impostazioni|Settings|Ajustes|Paramètres|Definições)'
    timeout: 10000
- scrollUntilVisible:
    element:
      text: '.*(Privacy Center).*'
    direction: DOWN
    timeout: 30000
    speed: 45
    visibilityPercentage: 20
    centerElement: false
- scrollUntilVisible:
    element:
      text: '.*(Cassaforte privata|Private Vault|Caja fuerte privada|Coffre privé|Cofre privado).*'
    direction: DOWN
    timeout: 30000
    speed: 35
    visibilityPercentage: 15
    centerElement: false
- tapOn:
    text: '.*(Cassaforte privata|Private Vault|Caja fuerte privada|Coffre privé|Cofre privado).*'
- extendedWaitUntil:
    visible: '.*(Uno spazio solo tuo|A space just for you|Un espacio solo para ti|Un espace rien qu’à toi|Um espaço só teu).*'
    timeout: 15000

# SETUP: clear AppLab state must expose the first-time Vault setup, never a
# pre-existing locked Vault.
- tapOn:
    id: 'vault_password_field'
- inputText: 'D2VaultPassword2026'
- tapOn:
    id: 'vault_repeat_password_field'
- inputText: 'D2VaultPassword2026'
- hideKeyboard
- tapOn:
    text: '(Crea cassaforte|Create Vault|Crear Caja fuerte|Créer le Coffre|Criar Cofre)'
- extendedWaitUntil:
    visible: '(Note private|Private notes|Notas privadas|Notes privées)'
    timeout: 30000
- extendedWaitUntil:
    visible: '(La cassaforte è vuota|The Vault is empty|La Caja fuerte está vacía|Le Coffre est vide|O Cofre está vazio)'
    timeout: 10000

# ENCRYPTED PAYLOAD: create a sentinel note whose title and body are both
# asserted. The sentinel is later required after relock and process restart.
- tapOn:
    text: '(Nuova nota|New note|Nueva nota|Nouvelle note|Nova nota)'
- extendedWaitUntil:
    visible: '(Nuovo contenuto privato|New private content|Nuevo contenido privado|Nouveau contenu privé|Novo conteúdo privado)'
    timeout: 10000
- tapOn:
    id: 'vault_note_title_field'
- inputText: 'D2_APPLAB_PERSISTENCE'
- tapOn:
    id: 'vault_note_body_field'
- inputText: 'D2 encrypted payload survives relock and restart'
- hideKeyboard
- tapOn:
    text: '(Salva|Save|Guardar|Enregistrer)'
- extendedWaitUntil:
    visible: 'D2_APPLAB_PERSISTENCE'
    timeout: 10000
- assertVisible: 'D2 encrypted payload survives relock and restart'

# RELOCK: force the explicit Vault lock and require the locked surface.
- tapOn:
    text: '(Blocca adesso|Lock now|Bloquear ahora|Verrouiller maintenant|Bloquear agora)'
- extendedWaitUntil:
    visible: '(Cassaforte bloccata|Vault locked|Caja fuerte bloqueada|Coffre verrouillé|Cofre bloqueado)'
    timeout: 10000

# WRONG PASSWORD: a failed unlock must remain locked and expose the explicit
# localized error. This prevents a false PASS that only checks navigation.
- tapOn:
    id: 'vault_password_field'
- inputText: 'D2WrongPassword2026'
- hideKeyboard
- tapOn:
    text: '(Sblocca|Unlock|Desbloquear|Déverrouiller)'
- extendedWaitUntil:
    visible: '(Password non corretta\.|Incorrect password\.|Contraseña incorrecta\.|Mot de passe incorrect\.|Palavra-passe incorreta\.)'
    timeout: 30000
- assertVisible:
    text: '(Cassaforte bloccata|Vault locked|Caja fuerte bloqueada|Coffre verrouillé|Cofre bloqueado)'

# CORRECT UNLOCK: clear the failed value, unlock with the setup password and
# require the previously encrypted sentinel payload.
- tapOn:
    id: 'vault_password_field'
- eraseText: 64
- inputText: 'D2VaultPassword2026'
- hideKeyboard
- tapOn:
    text: '(Sblocca|Unlock|Desbloquear|Déverrouiller)'
- extendedWaitUntil:
    visible: 'D2_APPLAB_PERSISTENCE'
    timeout: 30000
- assertVisible: 'D2 encrypted payload survives relock and restart'

# PROCESS PERSISTENCE: terminate the package, start a fresh Flutter process,
# navigate back to Vault, unlock and require the same encrypted payload.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: '(La mia agenda|My agenda|Mi agenda|Mon agenda|A minha agenda)'
    timeout: 15000
- tapOn:
    text: '(Home|Inicio|Accueil|Início)[\s\S]*'
    retryTapIfNoChange: true
- tapOn:
    text: '(Impostazioni|Settings|Ajustes|Paramètres|Definições)'
- extendedWaitUntil:
    visible: '(Impostazioni|Settings|Ajustes|Paramètres|Definições)'
    timeout: 10000
- scrollUntilVisible:
    element:
      text: '.*(Privacy Center).*'
    direction: DOWN
    timeout: 30000
    speed: 45
    visibilityPercentage: 20
    centerElement: false
- scrollUntilVisible:
    element:
      text: '.*(Cassaforte privata|Private Vault|Caja fuerte privada|Coffre privé|Cofre privado).*'
    direction: DOWN
    timeout: 30000
    speed: 35
    visibilityPercentage: 15
    centerElement: false
- tapOn:
    text: '.*(Cassaforte privata|Private Vault|Caja fuerte privada|Coffre privé|Cofre privado).*'
- extendedWaitUntil:
    visible: '(Cassaforte bloccata|Vault locked|Caja fuerte bloqueada|Coffre verrouillé|Cofre bloqueado)'
    timeout: 15000
- tapOn:
    id: 'vault_password_field'
- inputText: 'D2VaultPassword2026'
- hideKeyboard
- tapOn:
    text: '(Sblocca|Unlock|Desbloquear|Déverrouiller)'
- extendedWaitUntil:
    visible: 'D2_APPLAB_PERSISTENCE'
    timeout: 30000
- assertVisible: 'D2 encrypted payload survives relock and restart'

# Restore a deterministic shell state for the visual journey that follows.
- tapOn:
    text: '(Blocca adesso|Lock now|Bloquear ahora|Verrouiller maintenant|Bloquear agora)'
- extendedWaitUntil:
    visible: '(Cassaforte bloccata|Vault locked|Caja fuerte bloqueada|Coffre verrouillé|Cofre bloqueado)'
    timeout: 10000
- back
- extendedWaitUntil:
    visible: '(Impostazioni|Settings|Ajustes|Paramètres|Definições)'
    timeout: 10000
- back
- extendedWaitUntil:
    visible: '(La mia agenda|My agenda|Mi agenda|Mon agenda|A minha agenda)'
    timeout: 10000
