appId: com.riccardopinato.agenda_per_anna
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "La tua agenda, davvero tua."
    timeout: 15000
- tapOn: "Inizia"
- extendedWaitUntil:
    visible: "La mia giornata[\\s\\S]*"
    timeout: 15000
- extendedWaitUntil:
    visible: "Cattura"
    timeout: 10000
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "La mia giornata[\\s\\S]*"
    timeout: 15000
- extendedWaitUntil:
    visible: "Cattura"
    timeout: 10000
