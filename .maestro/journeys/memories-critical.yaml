appId: com.riccardopinato.agenda_per_anna
---
- launchApp
- runFlow:
    when:
      id: 'identity-offline-continue'
    commands:
      - tapOn:
          id: 'identity-offline-continue'
      - extendedWaitUntil:
          visible: '(La tua agenda, davvero tua\.|Your agenda, truly yours\.|Tu agenda, de verdad tuya\.|Ton agenda, vraiment à toi\.|A tua agenda, verdadeiramente tua\.)'
          timeout: 15000
      - tapOn:
          id: 'onboarding_preset_complete'
      - tapOn:
          id: 'onboarding_continue'
      - extendedWaitUntil:
          visible: '(Inizia con qualcosa di utile\.|Start with something useful\.|Empieza con algo útil\.|Commence par quelque chose d’utile\.|Começa com algo útil\.)'
          timeout: 10000
      - tapOn:
          id: 'onboarding_open_agenda'
- tapOn:
    id: 'main-nav-memories'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '(I miei ricordi|My memories|Mis recuerdos|Mes souvenirs|As minhas memórias)'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: 'memories-for-you'
    timeout: 15000
- assertVisible:
    id: 'memories-timeline'
- assertVisible:
    id: 'memories-browse'
- assertVisible:
    id: 'memories-for-you-surface'
- tapOn:
    id: 'memories-timeline'
- extendedWaitUntil:
    visible:
      id: 'memories-timeline-surface'
    timeout: 15000
- tapOn:
    id: 'memories-for-you'
- extendedWaitUntil:
    visible:
      id: 'memories-for-you-surface'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'memories-memory-map-entry'
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 20
- tapOn:
    id: 'memories-memory-map-entry'
- extendedWaitUntil:
    visible:
      id: 'memory-map-surface'
    timeout: 15000
- back
- extendedWaitUntil:
    visible:
      id: 'memories-for-you-surface'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'memories-then-now-entry'
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 20
- tapOn:
    id: 'memories-then-now-entry'
- extendedWaitUntil:
    visible:
      id: 'memories-then-now-surface'
    timeout: 15000
- back
