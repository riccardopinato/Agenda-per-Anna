appId: com.riccardopinato.agenda_per_anna
---
- launchApp
- runFlow:
    when:
      visible:
        id: 'identity-offline-continue'
    commands:
      - tapOn:
          id: 'identity-offline-continue'
      - extendedWaitUntil:
          visible: '(La tua agenda, davvero tua\.|Your agenda, truly yours\.|Tu agenda, de verdad tuya\.|Ton agenda, vraiment à toi\.|A tua agenda, verdadeiramente tua\.)'
          timeout: 15000
      - tapOn:
          id: 'onboarding_preset_complete'
      - tapOn:
          id: 'onboarding_continue'
      - extendedWaitUntil:
          visible: '(Inizia con qualcosa di utile\.|Start with something useful\.|Empieza con algo útil\.|Commence par quelque chose d’utile\.|Começa com algo útil\.)'
          timeout: 10000
      - tapOn:
          id: 'onboarding_open_agenda'
- tapOn:
    id: 'main-nav-more'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '(Altro|More|Más|Plus|Mais)'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'more-settings'
    direction: DOWN
    timeout: 30000
    speed: 45
    visibilityPercentage: 20
    centerElement: false
- tapOn:
    id: 'more-settings'
- extendedWaitUntil:
    visible:
      id: 'settings-hub-preferences-privacy'
    timeout: 10000
- tapOn:
    id: 'settings-hub-preferences-privacy'
- extendedWaitUntil:
    visible: '(Impostazioni|Settings|Ajustes|Paramètres|Definições)'
    timeout: 10000
- scrollUntilVisible:
    element:
      text: '.*(Privacy Center).*'
    direction: DOWN
    timeout: 30000
    speed: 45
    visibilityPercentage: 20
    centerElement: false
- scrollUntilVisible:
    element:
      text: '.*(Cassaforte privata|Private Vault|Caja fuerte privada|Coffre privé|Cofre privado).*'
    direction: DOWN
    timeout: 30000
    speed: 35
    visibilityPercentage: 15
    centerElement: false
- tapOn:
    text: '.*(Cassaforte privata|Private Vault|Caja fuerte privada|Coffre privé|Cofre privado).*'
- runFlow:
    when:
      visible: '.*(Uno spazio solo tuo|A space just for you|Un espacio solo para ti|Un espace rien qu’à toi|Um espaço só teu).*'
    commands:
      - tapOn:
          id: 'vault_password_field'
      - inputText: 'D2VaultPassword2026'
      - tapOn:
          id: 'vault_repeat_password_field'
      - inputText: 'D2VaultPassword2026'
      - hideKeyboard
      - tapOn:
          text: '(Crea cassaforte|Create Vault|Crear Caja fuerte|Créer le Coffre|Criar Cofre)'
      - extendedWaitUntil:
          visible: '(Nuova nota|New note|Nueva nota|Nouvelle note|Nova nota)'
          timeout: 180000
- runFlow:
    when:
      visible: '(Nuova nota|New note|Nueva nota|Nouvelle note|Nova nota)'
    commands:
      - tapOn:
          text: '(Blocca adesso|Lock now|Bloquear ahora|Verrouiller maintenant|Bloquear agora)'
      - extendedWaitUntil:
          visible: '.*(Cassaforte bloccata|Vault locked|Caja fuerte bloqueada|Coffre verrouillé|Cofre bloqueado).*'
          timeout: 15000
- extendedWaitUntil:
    visible: '.*(Cassaforte bloccata|Vault locked|Caja fuerte bloqueada|Coffre verrouillé|Cofre bloqueado).*'
    timeout: 15000
- tapOn:
    id: 'vault_password_field'
- eraseText: 64
- inputText: 'D2VaultPassword2026'
- hideKeyboard
- tapOn:
    text: '(Sblocca|Unlock|Desbloquear|Déverrouiller)'
- extendedWaitUntil:
    visible: '(Nuova nota|New note|Nueva nota|Nouvelle note|Nova nota)'
    timeout: 420000
- assertVisible:
    text: '(Nuova nota|New note|Nueva nota|Nouvelle note|Nova nota)'
