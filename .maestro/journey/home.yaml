appId: com.riccardopinato.agenda_per_anna
---
# Historical return path from People/Explore. UI5 has no legacy Home tab.
- back
- extendedWaitUntil:
    visible: '(Esplora|Explore|Explorar|Explorer)'
    timeout: 10000
- back
- extendedWaitUntil:
    visible:
      id: 'main-nav-more'
    timeout: 10000
- tapOn:
    id: 'main-nav-today'
- extendedWaitUntil:
    visible:
      id: 'ui5-today-date-strip'
    timeout: 15000
