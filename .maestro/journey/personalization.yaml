appId: com.riccardopinato.agenda_per_anna
---
# v1.01-E — Personalization accessibility/regression checkpoint.
# D6 ends on Home with the Complete preset from clean-install onboarding.
- extendedWaitUntil:
    visible: ".*(La mia agenda|My agenda|Mi agenda|Mon agenda|A minha agenda).*"
    timeout: 10000

- tapOn:
    id: "home_more_menu"
- tapOn:
    text: "(Personalizza|Personalize|Personalizar|Personnaliser)"
- extendedWaitUntil:
    visible: "(Personalizza|Personalize|Personalizar|Personnaliser)"
    timeout: 10000

# Preset changes remain reversible and module controls stay reachable.
- tapOn:
    id: "personalization_preset_essential"
- extendedWaitUntil:
    visible:
      id: "personalization_module_memories"
    timeout: 10000

# One manual change exercises Custom without depending on translated copy.
- tapOn:
    id: "personalization_module_shopping"
- extendedWaitUntil:
    visible:
      id: "personalization_restore_complete"
    timeout: 10000

# End in Complete so the product remains fully exposed for later/manual QA.
- tapOn:
    id: "personalization_restore_complete"
- extendedWaitUntil:
    visible:
      id: "personalization_module_ecosystem"
    timeout: 10000

- back
- extendedWaitUntil:
    visible: ".*(La mia agenda|My agenda|Mi agenda|Mon agenda|A minha agenda).*"
    timeout: 10000
