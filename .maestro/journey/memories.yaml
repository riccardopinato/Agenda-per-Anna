appId: com.riccardopinato.agenda_per_anna
---
# Visual Journey runs after atomic runtime and must not inherit the scroll/state
# left by the preceding Today checkpoint. Re-launch and wait for the stable
# primary-navigation semantic before opening Memories.
- launchApp
- extendedWaitUntil:
    visible:
      id: 'main-nav-memories'
    timeout: 15000
- tapOn:
    id: 'main-nav-memories'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '(I miei ricordi|My memories|Mis recuerdos|Mes souvenirs|As minhas memórias)'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: 'memories-for-you'
    timeout: 15000
- assertVisible:
    id: 'memories-timeline'
- assertVisible:
    id: 'memories-browse'
- assertVisible:
    id: 'memories-for-you-surface'
- tapOn:
    id: 'memories-timeline'
- extendedWaitUntil:
    visible:
      id: 'memories-timeline-surface'
    timeout: 15000
- tapOn:
    id: 'memories-for-you'
- extendedWaitUntil:
    visible:
      id: 'memories-for-you-surface'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'memories-memory-map-entry'
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 20
- tapOn:
    id: 'memories-memory-map-entry'
- extendedWaitUntil:
    visible:
      id: 'memory-map-surface'
    timeout: 15000
- back
- extendedWaitUntil:
    visible:
      id: 'memories-for-you-surface'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'memories-then-now-entry'
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 20
- tapOn:
    id: 'memories-then-now-entry'
- extendedWaitUntil:
    visible:
      id: 'memories-then-now-surface'
    timeout: 15000
- back
- extendedWaitUntil:
    visible:
      id: 'memories-for-you-surface'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'memories-collections-entry'
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 20
- tapOn:
    id: 'memories-collections-entry'
- extendedWaitUntil:
    visible:
      id: 'memory-collections-surface'
    timeout: 15000
- back
