appId: com.riccardopinato.agenda_per_anna
---
- extendedWaitUntil:
    visible: '(La mia giornata|My day|Mi día|Ma journée|O meu dia)[\\s\\S]*'
    timeout: 30000
- tapOn:
    id: 'main-nav-memories'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '(I miei ricordi|My memories|Mis recuerdos|Mes souvenirs|As minhas memórias)'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: 'memories-for-you'
    timeout: 15000
- assertVisible:
    id: 'memories-timeline'
- assertVisible:
    id: 'memories-browse'
- assertVisible:
    id: 'memories-for-you-surface'
- tapOn:
    id: 'memories-timeline'
- extendedWaitUntil:
    visible:
      id: 'memories-timeline-surface'
    timeout: 15000
- tapOn:
    id: 'memories-for-you'
- extendedWaitUntil:
    visible:
      id: 'memories-for-you-surface'
    timeout: 15000
