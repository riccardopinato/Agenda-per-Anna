appId: com.riccardopinato.agenda_per_anna
---
- extendedWaitUntil:
    visible: '(La mia giornata|My day|Mi día|Ma journée|O meu dia)[\s\S]*'
    timeout: 30000
- tapOn:
    id: 'main-nav-memories'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '(I miei ricordi|My memories|Mis recuerdos|Mes souvenirs|As minhas memórias)'
    timeout: 15000
- scrollUntilVisible:
    element:
      text: '(Riscopri|Rediscover|Redescubrir|Redécouvrir|Redescobrir)[\s\S]*'
    direction: DOWN
    timeout: 30000
    speed: 35
    visibilityPercentage: 20
    centerElement: false
- tapOn:
    text: '(Riscopri|Rediscover|Redescubrir|Redécouvrir|Redescobrir)[\s\S]*'
- extendedWaitUntil:
    visible: '(Riscopri i tuoi ricordi|Rediscover your memories|Redescubre tus recuerdos|Redécouvre tes souvenirs|Redescobre as tuas memórias)'
    timeout: 15000
