appId: com.riccardopinato.agenda_per_anna
---
# The previous visual checkpoint is Account & Sync, which is pushed from Home.
# Return once to the agenda hub, then open Life Archive -> Trash.
- back
- extendedWaitUntil:
    visible: ".*(La mia agenda|My agenda|Mi agenda|Mon agenda|A minha agenda).*"
    timeout: 10000
- tapOn:
    text: ".*(Archivio|Archive|Archivo|Archives|Arquivo).*"
- extendedWaitUntil:
    visible: ".*(Archivio della vita|Life archive|Archivo de vida|Archives de vie|Arquivo da vida).*"
    timeout: 10000
- tapOn:
    text: ".*(Cestino|Trash|Papelera|Corbeille|Lixo).*"
- extendedWaitUntil:
    visible: ".*(Cestino|Trash|Papelera|Corbeille|Lixo).*"
    timeout: 10000
