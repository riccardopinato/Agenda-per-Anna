appId: com.riccardopinato.agenda_per_anna
---
- back
- extendedWaitUntil:
    visible: '(Altro|More|Más|Plus|Mais)'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'more-archive'
    direction: UP
    timeout: 10000
- tapOn:
    id: 'more-archive'
- extendedWaitUntil:
    visible: '.*(Archivio della vita|Life archive|Archivo de vida|Archives de vie|Arquivo da vida).*'
    timeout: 10000
- tapOn:
    text: '.*(Cestino|Trash|Papelera|Corbeille|Lixo).*'
- extendedWaitUntil:
    visible: '.*(Cestino|Trash|Papelera|Corbeille|Lixo).*'
    timeout: 10000
