appId: com.riccardopinato.agenda_per_anna
---
# The previous "memories" checkpoint leaves the journey inside Memories,
# which was opened from the v1.00-B Explore surface.
- back
- extendedWaitUntil:
    visible: '(Esplora|Explore|Explorar|Explorer)'
    timeout: 10000
- scrollUntilVisible:
    element:
      text: '(Persone importanti|Important people|Personas importantes|Personnes importantes|Pessoas importantes)[\s\S]*'
    direction: DOWN
    timeout: 10000
- tapOn:
    text: '(Persone importanti|Important people|Personas importantes|Personnes importantes|Pessoas importantes)[\s\S]*'
- extendedWaitUntil:
    visible: '(Persone importanti|Important people|Personas importantes|Personnes importantes|Pessoas importantes)'
    timeout: 10000
