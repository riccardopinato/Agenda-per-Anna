appId: com.riccardopinato.agenda_per_anna
---
- tapOn:
    text: 'Home[\s\S]*'
    retryTapIfNoChange: true
- tapOn:
    text: '(Archivio|Archive|Archivo|Archives|Arquivo)'
- extendedWaitUntil:
    visible: "Archivio della vita"
    timeout: 10000
- assertVisible:
    text: 'Cerca in tutta la tua storia[\s\S]*'
- assertVisible:
    text: 'Tutto'
- assertVisible:
    text: 'Diario'
- assertVisible:
    text: 'Agenda'
- assertVisible:
    text: 'Allenamenti'
- back
- extendedWaitUntil:
    visible: "(La mia agenda|My agenda|Mi agenda|Mon agenda|A minha agenda)"
    timeout: 10000

