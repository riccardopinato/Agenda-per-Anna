appId: com.riccardopinato.agenda_per_anna
---
- tapOn:
    text: "Oggi[\\s\\S]*"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "La mia giornata[\\s\\S]*"
    timeout: 10000
- extendedWaitUntil:
    visible: "Cattura"
    timeout: 10000
- tapOn: "Cattura"
- extendedWaitUntil:
    visible: "Scrivi un momento"
    timeout: 10000
- extendedWaitUntil:
    visible: "Nota vocale"
    timeout: 10000
- extendedWaitUntil:
    visible: "Foto"
    timeout: 10000
- tapOn: "Chiudi"
- scrollUntilVisible:
    element:
      text: "Momenti del giorno[\\s\\S]*"
    direction: DOWN
    timeout: 10000
