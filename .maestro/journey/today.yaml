appId: com.riccardopinato.agenda_per_anna
---
# UI5: Today may have no agenda, diary or reminders. Never require
# the legacy conditional today-focus-card or the retired Capture FAB.
- launchApp
- extendedWaitUntil:
    visible:
      id: 'main-nav-today'
    timeout: 15000
- tapOn:
    id: 'main-nav-today'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '(La mia giornata|My day|Mi día|Ma journée|O meu dia)[\\s\\S]*'
    timeout: 15000
- assertVisible:
    id: 'ui5-today-date-strip'
- assertVisible:
    id: 'main-nav-create'
- tapOn:
    id: 'main-nav-create'
- extendedWaitUntil:
    visible:
      id: 'capture-effective-date'
    timeout: 15000
- assertVisible:
    id: 'capture-effective-date'
- extendedWaitUntil:
    visible: '(Scrivi un momento|Write a moment|Escribir un momento|Écrire un moment|Escrever um momento)[\\s\\S]*'
    timeout: 10000
- extendedWaitUntil:
    visible: '(Nota vocale|Voice note|Nota de voz|Note vocale)[\\s\\S]*'
    timeout: 10000
- extendedWaitUntil:
    visible: '(Foto|Photo)[\\s\\S]*'
    timeout: 10000
- tapOn:
    text: '(Chiudi|Close|Cerrar|Fermer|Fechar)'
- extendedWaitUntil:
    visible:
      id: 'ui5-today-date-strip'
    timeout: 10000
