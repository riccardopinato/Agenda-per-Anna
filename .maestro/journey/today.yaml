appId: com.riccardopinato.agenda_per_anna
---
- tapOn:
    text: "(Oggi|Today|Hoy|Aujourd’hui|Hoje)[\\s\\S]*"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '(La mia giornata|My day|Mi día|Ma journée|O meu dia)[\s\S]*'
    timeout: 10000
- extendedWaitUntil:
    visible: '(Cattura|Capture|Capturar|Capturer)'
    timeout: 10000
- tapOn: '(Cattura|Capture|Capturar|Capturer)'
- extendedWaitUntil:
    visible: '(Scrivi un momento|Write a moment|Escribir un momento|Écrire un moment|Escrever um momento)[\s\S]*'
    timeout: 10000
- extendedWaitUntil:
    visible: '(Nota vocale|Voice note|Nota de voz|Note vocale)[\s\S]*'
    timeout: 10000
- extendedWaitUntil:
    visible: '(Foto|Photo)[\s\S]*'
    timeout: 10000
- scrollUntilVisible:
    element:
      text: '(Chiudi|Close|Cerrar|Fermer|Fechar)'
    direction: DOWN
    timeout: 10000
- tapOn: '(Chiudi|Close|Cerrar|Fermer|Fechar)'
# The current Today composition exposes the diary editor after Capture closes.
# Assert a stable localized section that is actually rendered in this surface.
- scrollUntilVisible:
    element:
      text: '(Pensieri e note|Thoughts and notes|Pensamientos y notas|Pensées et notes|Pensamentos e notas)[\\s\\S]*'
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 20
