appId: com.riccardopinato.agenda_per_anna
---
- tapOn:
    text: "(Oggi|Today|Hoy|Aujourd’hui|Hoje)[\\s\\S]*"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "La mia giornata[\\s\\S]*"
    timeout: 10000
- extendedWaitUntil:
    visible: "Cattura"
    timeout: 10000
- tapOn: "Cattura"
- extendedWaitUntil:
    visible: "Scrivi un momento[\\s\\S]*"
    timeout: 10000
- extendedWaitUntil:
    visible: "Nota vocale[\\s\\S]*"
    timeout: 10000
- extendedWaitUntil:
    visible: "Foto[\\s\\S]*"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Chiudi"
    direction: DOWN
    timeout: 10000
- tapOn: "Chiudi"
- scrollUntilVisible:
    element:
      text: "Momenti del giorno[\\s\\S]*"
    direction: DOWN
    timeout: 10000
