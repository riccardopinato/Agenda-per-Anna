appId: com.riccardopinato.agenda_per_anna
---
# Visual Journey starts after the atomic runtime, which may finish in a nested
# surface such as Private Vault. Re-launch first so this checkpoint owns its
# starting state instead of depending on the previous journey.
- launchApp
- extendedWaitUntil:
    visible:
      id: 'today-open-calendar'
    timeout: 15000
- tapOn:
    id: 'today-open-calendar'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'calendar-open-month-notebook'
    timeout: 10000
- assertVisible:
    text: '(Mese|Month|Mes|Mois|Mês)[\s\S]*'
- assertVisible:
    text: '(Settimana|Week|Semana|Semaine)[\s\S]*'
- assertVisible:
    id: 'calendar-open-month-notebook'
- assertVisible:
    id: 'calendar-open-year-overview'

- tapOn:
    id: 'calendar-open-year-overview'
- extendedWaitUntil:
    visible:
      id: 'year-review-surface'
    timeout: 15000
- back
