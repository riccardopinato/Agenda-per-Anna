name: agenda_per_anna
description: Anna's Diary, diario e agenda personale multipiattaforma.
publish_to: "none"
version: 0.38.0+45

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  table_calendar: ^3.2.0
  shared_preferences: ^2.5.3
  path_provider: 2.1.6
  sembast: 3.8.6
  sembast_web: 2.4.4+1
  uuid: ^4.5.1
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  file_picker: ^13.1.0
  local_auth: ^3.0.0
  crypto: ^3.0.6
  archive: ^4.3.0
  supabase_flutter: ^2.17.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  image_picker: ^1.2.0
  flutter_image_compress: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#F7C8D7"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true
