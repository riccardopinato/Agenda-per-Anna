name: AppLab Source Gate
# Repository-local, source-only contract checks. Do NOT invoke AppLab's external
# APK-building runner. Native builds are manual workflows owned by this project.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anna-source-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contracts:
    name: UI5 source and visual-flow contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check UI5 source and visual-flow contracts (no APK)
        run: python3 tool/check_ui5_visual_flows.py
