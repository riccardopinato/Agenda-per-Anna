name: AppLab Production Gate
# Golden AppLab QA pilot — hardened verifier pinned at an immutable commit.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: applab-production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  applab:
    uses: riccardopinato/AppLab/.github/workflows/external-project-runner.yml@c276f03d5935a2cbd9e089175fd311466cf491ef
    with:
      repository: riccardopinato/Agenda-per-Anna
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      source_ref: ${{ github.head_ref || github.ref_name }}
      working_directory: "."
      flutter_version: "3.47.5"
      java_version: "17"
      prepare_command: 'bash "$GITHUB_WORKSPACE/.applab/watch-profiles/agenda_per_anna_prepare.sh"'
      post_pub_get_command: 'bash "$GITHUB_WORKSPACE/.applab/watch-profiles/agenda_per_anna_post_pub_get.sh"'
      api_level: "35"
      emulator_profile: pixel_7_pro
      apk_path: build/app/outputs/flutter-apk/app-release.apk
      package_id: com.riccardopinato.agenda_per_anna
      build_command: >-
        flutter build apk --release --target-platform android-x64 --tree-shake-icons
        --dart-define=ANNAS_DIARY_INTEGRATION_TEST=true
        --dart-define=ANNA_STORE_RELEASE=false
        --dart-define=ANNA_PREMIUM_PREVIEW=true
        --dart-define=FIREBASE_ENABLED=true
      run_maestro: true
      maestro_flow: .maestro/applab-smoke.yaml
      history_key: annas-diary
      cache_verification: true
      config_fingerprint: annas-diary-factory-fast-v4-journey-aware
      analysis_mode: fast
      baseline_sha: ${{ github.event.pull_request.base.sha || '' }}
      publish_release_artifact: false
