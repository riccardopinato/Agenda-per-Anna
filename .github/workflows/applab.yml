name: AppLab Production Gate
# Golden AppLab QA pilot — hardened verifier pinned at an immutable commit.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: applab-production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  applab:
    uses: riccardopinato/AppLab/.github/workflows/external-project-runner.yml@5fce85ec7c4f41dd8a9ad54c1e7ced410e766b89
    with:
      repository: riccardopinato/Agenda-per-Anna
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      source_ref: ${{ github.head_ref || github.ref_name }}
      working_directory: "."
      flutter_version: "3.47.5"
      java_version: "17"
      prepare_command: >-
        rm -rf android /tmp/agenda_applab &&
        flutter create --project-name agenda_per_anna --org com.riccardopinato --platforms=android /tmp/agenda_applab &&
        cp -R /tmp/agenda_applab/android . &&
        python3 tool/prepare_android_platform.py
      post_pub_get_command: >-
        flutter pub get --enforce-lockfile &&
        dart run flutter_launcher_icons -f tool/flutter_launcher_icons_android.yaml
      api_level: "35"
      emulator_profile: pixel_7_pro
      apk_path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      package_id: com.riccardopinato.agenda_per_anna
      build_command: >-
        if [ -f android/app/google-services.json ]; then
        flutter build apk --release --split-per-abi --tree-shake-icons --dart-define=ANNAS_DIARY_INTEGRATION_TEST=true --dart-define=ANNA_STORE_RELEASE=false --dart-define=ANNA_PREMIUM_PREVIEW=true --dart-define=FIREBASE_ENABLED=true;
        else
        flutter build apk --release --split-per-abi --tree-shake-icons --dart-define=ANNAS_DIARY_INTEGRATION_TEST=true --dart-define=ANNA_STORE_RELEASE=false --dart-define=ANNA_PREMIUM_PREVIEW=true;
        fi
      run_maestro: true
      maestro_flow: .maestro/applab-smoke.yaml
      history_key: annas-diary
      cache_verification: false
      config_fingerprint: annas-diary-golden-pilot-v1
      analysis_mode: certification
      publish_release_artifact: false
