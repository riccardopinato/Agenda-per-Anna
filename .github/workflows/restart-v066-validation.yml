name: Restart v0.66 clean gates

on:
  push:
    branches:
      - restart-v066-lifecycle-integrity
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: restart-v066-clean-gates-${{ github.sha }}
  cancel-in-progress: false

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact restart head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Create pinned platform skeletons
        run: |
          rm -rf android web /tmp/agenda_restart
          flutter create --project-name agenda_per_anna --org com.riccardopinato --platforms=android,web /tmp/agenda_restart
          cp -R /tmp/agenda_restart/android .
          cp -R /tmp/agenda_restart/web .

      - name: Apply and verify platform configuration
        run: |
          python3 -m py_compile             tool/prepare_android_platform.py             tool/prepare_web_platform.py             tool/finalize_web_build.py             tool/android_size_report.py
          python3 tool/prepare_android_platform.py
          python3 tool/prepare_web_platform.py

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons -f tool/flutter_launcher_icons_android.yaml

      - name: Analyze
        run: flutter analyze

      - name: Unit and regression tests
        run: flutter test

      - name: Build web release
        run: |
          flutter build web --release --base-href "/Agenda-per-Anna/"
          python3 tool/finalize_web_build.py

      - name: Add public legal pages
        run: |
          cp legal/privacy.html build/web/privacy.html
          cp legal/terms.html build/web/terms.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  android-size:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/.signing/agenda-release.jks
    steps:
      - name: Checkout exact restart head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Generate pinned Android platform
        run: |
          rm -rf android /tmp/agenda_restart_android
          flutter create --project-name agenda_per_anna --org com.riccardopinato --platforms=android /tmp/agenda_restart_android
          cp -R /tmp/agenda_restart_android/android .

      - name: Apply stable Android release configuration
        run: python3 tool/prepare_android_platform.py --release-signing

      - name: Verify stable release keystore
        run: |
          keytool -list \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons -f tool/flutter_launcher_icons_android.yaml

      - name: Build production-equivalent ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          FIREBASE_ARG=""
          if [ -f android/app/google-services.json ]; then
            FIREBASE_ARG="--dart-define=FIREBASE_ENABLED=true"
          fi
          flutter build apk             --release             --split-per-abi             --obfuscate             --tree-shake-icons             --split-debug-info=build/restart-size-symbols             $FIREBASE_ARG

      - name: Generate ARM64 size report
        run: |
          python3 tool/android_size_report.py \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            --output build/restart-arm64-size.txt
          cat build/restart-arm64-size.txt

      - name: Prepare installable APK
        run: |
          mkdir -p build/delivery
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/delivery/Anna-Diary-v0.67.0-arm64.apk
          sha256sum build/delivery/Anna-Diary-v0.67.0-arm64.apk \
            > build/delivery/SHA256SUMS.txt

      - name: Upload installable ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: annas-diary-v067-arm64
          path: |
            build/delivery/Anna-Diary-v0.67.0-arm64.apk
            build/delivery/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  deploy-web:
    needs: development
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy Anna's Diary PWA
        id: deployment
        uses: actions/deploy-pages@v4

  applab:
    uses: riccardopinato/AppLab/.github/workflows/external-project-runner.yml@a871a1c1e0ab8339c48bc8ee53ee4cc34d634d34
    with:
      repository: riccardopinato/Agenda-per-Anna
      ref: ${{ github.sha }}
      working_directory: "."
      flutter_version: "3.47.5"
      java_version: "17"
      prepare_command: >-
        rm -rf android /tmp/agenda_restart_applab &&
        flutter create --project-name agenda_per_anna --org com.riccardopinato --platforms=android /tmp/agenda_restart_applab &&
        cp -R /tmp/agenda_restart_applab/android . &&
        python3 tool/prepare_android_platform.py
      post_pub_get_command: >-
        flutter pub get --enforce-lockfile &&
        dart run flutter_launcher_icons -f tool/flutter_launcher_icons_android.yaml
      api_level: "35"
      emulator_profile: pixel_7_pro
      apk_path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      package_id: com.riccardopinato.agenda_per_anna
      build_command: >-
        FIREBASE_ARG="";
        if [ -f android/app/google-services.json ]; then FIREBASE_ARG="--dart-define=FIREBASE_ENABLED=true"; fi;
        flutter build apk --release --split-per-abi --tree-shake-icons --dart-define=ANNAS_DIARY_INTEGRATION_TEST=true $FIREBASE_ARG
      run_flutter_tests: true
      run_maestro: true
      maestro_flow: .maestro/applab-smoke.yaml
      history_key: annas-diary-v066-restart
      cache_verification: false
      cache_epoch: "1"
