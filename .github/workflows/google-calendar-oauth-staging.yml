name: Google Calendar OAuth staging security tests

on:
  push:
    branches:
      - staging/google-calendar-direct-prepared-v1
    paths:
      - 'staging/google_calendar_direct/backend/**'
      - 'staging/google_calendar_direct/supabase/**'
      - '.github/workflows/google-calendar-oauth-staging.yml'
  pull_request:
    paths:
      - 'staging/google_calendar_direct/backend/**'
      - 'staging/google_calendar_direct/supabase/**'
      - '.github/workflows/google-calendar-oauth-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oauth-staging:
    name: Node OAuth broker mock security tests (no Google access)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check staging/google_calendar_direct/backend/oauth_broker.mjs
      - name: Execute mocked OAuth security tests
        run: node --test staging/google_calendar_direct/backend/oauth_broker.test.mjs

      - name: Check Deno WebCrypto portable module syntax
        run: node --check staging/google_calendar_direct/supabase/functions/gcal-oauth-callback/webcrypto_core.mjs
      - name: Execute mocked Deno WebCrypto OAuth tests
        run: node --test staging/google_calendar_direct/supabase/functions/gcal-oauth-callback/webcrypto_core.test.mjs

      - name: Verify private Postgres OAuth adapter syntax
        run: node --check staging/google_calendar_direct/supabase/functions/gcal-oauth-callback/db_ports.mjs
      - name: Mock-test atomic state and encrypted link adapters
        run: node --test staging/google_calendar_direct/supabase/functions/gcal-oauth-callback/db_ports.test.mjs

      - name: Verify two-phase consent and identity verifier syntax
        run: |
          node --check staging/google_calendar_direct/supabase/functions/gcal-oauth-callback/two_phase_core.mjs
          node --check staging/google_calendar_direct/supabase/functions/gcal-oauth-callback/production_identity.mjs
          node --check staging/google_calendar_direct/supabase/functions/gcal-oauth-callback/confirmation_ports.mjs
      - name: Mock-test two-phase Google OAuth and production identity bridge
        run: node --test staging/google_calendar_direct/supabase/functions/gcal-oauth-callback/two_phase_core.test.mjs

      - name: Verify locked Deno HTTP gateway syntax
        run: node --check staging/google_calendar_direct/supabase/functions/gcal-oauth-callback/http_handler.mjs
      - name: Mock-test authenticated web and browser OAuth HTTP endpoints
        run: node --test staging/google_calendar_direct/supabase/functions/gcal-oauth-callback/http_handler.test.mjs

      - name: Check server-only Google token refresh and revocation syntax
        run: node --check staging/google_calendar_direct/supabase/functions/gcal-oauth-callback/token_lifecycle.mjs
      - name: Mock-test account-scoped refresh and revocation lifecycle
        run: node --test staging/google_calendar_direct/supabase/functions/gcal-oauth-callback/token_lifecycle.test.mjs

      - name: Check staging database request budget syntax
        run: node --check staging/google_calendar_direct/supabase/functions/gcal-oauth-callback/request_budget.mjs
      - name: Mock-test fail-closed account request budgets
        run: node --test staging/google_calendar_direct/supabase/functions/gcal-oauth-callback/request_budget.test.mjs

      - name: Check public browser callback global quota syntax
        run: node --check staging/google_calendar_direct/supabase/functions/gcal-oauth-callback/callback_budget.mjs
      - name: Mock-test global callback throttle and fail-closed behavior
        run: node --test staging/google_calendar_direct/supabase/functions/gcal-oauth-callback/callback_budget.test.mjs

      - name: End-to-end mocked two-phase HTTP consent and disconnect
        run: node --test staging/google_calendar_direct/supabase/functions/gcal-oauth-callback/oauth_http_integration.test.mjs

      - name: Check unreleased Deno Edge entrypoint syntax
        run: node --check staging/google_calendar_direct/supabase/functions/gcal-oauth-callback/index_ready.mjs
      - name: Assert deployed function remains locked and staging dependencies are pinned
        run: node --test staging/google_calendar_direct/supabase/functions/gcal-oauth-callback/index_ready.static.test.mjs

  deno-runtime-preflight:
    name: Deno locked runtime preflight (no secrets, no Google)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
      - name: Install pinned Deno 2.9.8
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: '2.9.8'
      - name: Check Deno module graph and npm Postgres import
        run: deno check staging/google_calendar_direct/supabase/functions/gcal-oauth-callback/index_ready.mjs
      - name: Exercise Deno runtime with explicit locked configuration only
        shell: bash
        run: |
          set -euo pipefail
          export DENO_NO_PROMPT=1
          unset ANNA_GCAL_STAGING_ENABLE
          deno run --allow-net --allow-env=ANNA_GCAL_STAGING_ENABLE \
            staging/google_calendar_direct/supabase/functions/gcal-oauth-callback/index_ready.mjs > /tmp/anna-gcal-deno-runtime.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          healthy=0
          for attempt in {1..30}; do
            if curl -fsS --max-time 1 http://127.0.0.1:8000/functions/v1/gcal-oauth-callback/health > /tmp/anna-gcal-health.json; then
              healthy=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Deno runtime failed to start"
              exit 1
            fi
            sleep 1
          done
          test "$healthy" -eq 1
          node -e "const f=require('fs');const h=JSON.parse(f.readFileSync('/tmp/anna-gcal-health.json','utf8'));if(h.status!=='locked'||h.google_oauth_active!==false||h.google_calendar_writes_active!==false)process.exit(1);"
          status=$(curl -sS -o /tmp/anna-gcal-start.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -d '{}' \
            http://127.0.0.1:8000/functions/v1/gcal-oauth-callback/start)
          test "$status" = "503"
          node -e "const f=require('fs');const h=JSON.parse(f.readFileSync('/tmp/anna-gcal-start.json','utf8'));if(h.error!=='STAGING_NOT_ACTIVATED')process.exit(1);"

