name: Android size audit

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "firebase/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "tool/**"
      - ".github/workflows/android-size-audit.yml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-size-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Generate pinned Android platform
        run: |
          rm -rf android /tmp/agenda_android
          flutter create             --project-name agenda_per_anna             --org com.riccardopinato             --platforms=android             /tmp/agenda_android
          cp -R /tmp/agenda_android/android .

      - name: Create disposable audit signing key
        shell: bash
        run: |
          set -euo pipefail
          AUDIT_STORE="$RUNNER_TEMP/agenda-audit.jks"
          keytool -genkeypair -storetype JKS -keystore "$AUDIT_STORE" -storepass audit-store-pass -keypass audit-key-pass -alias audit -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Anna Diary CI Audit,O=CI,C=IT" -noprompt

          AUDIT_B64=$(base64 -w0 "$AUDIT_STORE")
          echo "::add-mask::$AUDIT_B64"
          echo "::add-mask::audit-store-pass"
          echo "::add-mask::audit-key-pass"
          {
            echo "ANDROID_KEYSTORE_BASE64=$AUDIT_B64"
            echo "ANDROID_KEYSTORE_PASSWORD=audit-store-pass"
            echo "ANDROID_KEY_ALIAS=audit"
            echo "ANDROID_KEY_PASSWORD=audit-key-pass"
            echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/.signing/agenda-release.jks"
          } >> "$GITHUB_ENV"

      - name: Apply Android configuration and signing path
        run: python3 tool/prepare_android_platform.py --release-signing

      - name: Verify audit keystore path
        run: |
          keytool -list             -keystore "$ANDROID_KEYSTORE_PATH"             -storepass "$ANDROID_KEYSTORE_PASSWORD"             -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons -f tool/flutter_launcher_icons_android.yaml -f tool/flutter_launcher_icons_android.yaml

      - name: Build production-equivalent ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          FIREBASE_ARG=""
          if [ -f android/app/google-services.json ]; then
            FIREBASE_ARG="--dart-define=FIREBASE_ENABLED=true"
          fi
          flutter build apk             --release             --split-per-abi             --obfuscate             --tree-shake-icons             --split-debug-info=build/size-audit-symbols             $FIREBASE_ARG

      - name: Generate size report
        run: |
          mkdir -p build/size-audit
          python3 tool/android_size_report.py             build/app/outputs/flutter-apk/app-arm64-v8a-release.apk             --output build/size-audit/arm64-size.txt

      - name: Upload size report only
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-size-report
          path: build/size-audit/arm64-size.txt
          if-no-files-found: error
          retention-days: 14
