name: v0.33.1 Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Create web platform skeleton
        run: |
          rm -rf /tmp/agenda_base
          flutter create --project-name agenda_per_anna --org com.riccardopinato --platforms=web /tmp/agenda_base
          cp -R /tmp/agenda_base/web .
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-fatal-warnings
      - run: flutter test
      - run: flutter build web --release
