name: Organic iOS Journal Flutter visual review (PR-only)
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "lib/**"
      - "test/organic_journal_visual_capture_test.dart"
      - ".github/workflows/organic-journal-visual-review.yml"

permissions:
  contents: read

concurrency:
  group: organic-journal-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-capture:
    if: github.head_ref == 'design/organic-ios-journal-non-m3-surfaces-20261116' ||
      github.head_ref == 'integration/ios-journal-three-surfaces-20261116' ||
      github.head_ref == 'design/organic-journal-home-parity-20261116' ||
      github.head_ref == 'feat/v137-memories-editorial-album-20261116' ||
      github.head_ref == 'feat/v138-more-settings-essential-20261116' ||
      github.head_ref == 'design/settings-journal-profile-grouping-20261117' ||
      github.head_ref == 'design/memories-compact-authentic-notebook-20261117' ||
      github.head_ref == 'design/secondary-journal-wave1-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Prepare synthetic Flutter platform skeletons
        run: |
          rm -rf android web /tmp/anna_journal_base
          flutter create --project-name agenda_per_anna --org com.riccardopinato --platforms=android,web /tmp/anna_journal_base
          cp -R /tmp/anna_journal_base/android .
          cp -R /tmp/anna_journal_base/web .
          python3 tool/prepare_android_platform.py
          python3 tool/prepare_web_platform.py
      - name: Fetch locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Load icon glyphs for faithful render
        run: |
          mkdir -p test/fixtures
          cp "$(dirname "$(command -v flutter)")/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" test/fixtures/
      - name: Capture empty private memories / journal chrome
        run: |
          flutter test --update-goldens \
            --dart-define=ANNA_JOURNAL_CAPTURE=true \
            --dart-define=ANNA_JOURNAL_POPULATED=false \
            test/organic_journal_visual_capture_test.dart
      - name: Capture synthetic populated memories
        run: |
          flutter test --update-goldens \
            --dart-define=ANNA_JOURNAL_CAPTURE=true \
            --dart-define=ANNA_JOURNAL_POPULATED=true \
            test/organic_journal_visual_capture_test.dart
      - name: Upload real Flutter review screenshots including secondary routes
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anna-journal-ios-non-m3-review-${{ github.sha }}
          path: |
            test/goldens/organic_journal_more_390.png
            test/goldens/organic_journal_settings_hub_390.png
            test/goldens/organic_journal_settings_profile_390.png
            test/goldens/organic_journal_explore_390.png
            test/goldens/organic_journal_personalization_390.png
            test/goldens/organic_journal_memories_empty_390.png
            test/goldens/organic_journal_memories_populated_390.png
          if-no-files-found: error
          retention-days: 7
