name: Build Agenda per Anna

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter platform skeleton
        run: |
          rm -rf /tmp/agenda_base
          flutter create --project-name agenda_per_anna --org com.riccardopinato --platforms=android,web,ios /tmp/agenda_base
          cp -R /tmp/agenda_base/android .
          cp -R /tmp/agenda_base/web .
          cp -R /tmp/agenda_base/ios .

      - name: Restore persistent Android debug keystore
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: agenda-per-anna-android-debug-keystore-v1

      - name: Enable Android core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          needle = "compileOptions {"
          if needle not in s:
              raise SystemExit("compileOptions block not found")
          s = s.replace(
              needle,
              needle + "\n        isCoreLibraryDesugaringEnabled = true",
              1,
          )
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' not in s:
              s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          p.write_text(s)
          PY

      - name: Decode app icon
        run: |
          mkdir -p assets/icon
          base64 -d assets/icon/app_icon.b64 > assets/icon/app_icon.jpg

      - name: Adjust icon config path
        run: |
          sed -i 's#assets/icon/app_icon.png#assets/icon/app_icon.jpg#g' pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agenda-per-anna-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload signing key backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenda-per-anna-debug-keystore
          path: ~/.android/debug.keystore
          if-no-files-found: ignore
          retention-days: 90
