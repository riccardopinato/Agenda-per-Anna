name: Build Agenda per Anna

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter platform skeleton
        run: |
          rm -rf /tmp/agenda_base
          flutter create --project-name agenda_per_anna --org com.riccardopinato --platforms=android,web,ios /tmp/agenda_base
          cp -R /tmp/agenda_base/android .
          cp -R /tmp/agenda_base/web .
          cp -R /tmp/agenda_base/ios .

      - name: Decode app icon
        run: |
          mkdir -p assets/icon
          base64 -d assets/icon/app_icon.b64 > assets/icon/app_icon.jpg

      - name: Adjust icon config path
        run: |
          sed -i 's#assets/icon/app_icon.png#assets/icon/app_icon.jpg#g' pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Prepare Web icon
        run: |
          cp assets/icon/app_icon.jpg web/icons/Icon-192.png
          cp assets/icon/app_icon.jpg web/icons/Icon-512.png
          cp assets/icon/app_icon.jpg web/icons/Icon-maskable-192.png
          cp assets/icon/app_icon.jpg web/icons/Icon-maskable-512.png

      - name: Build Web
        run: flutter build web --release

      - name: Package Web
        run: |
          cd build/web
          zip -r ../agenda-per-anna-web.zip .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agenda-per-anna-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Web PWA
        uses: actions/upload-artifact@v4
        with:
          name: agenda-per-anna-web
          path: build/agenda-per-anna-web.zip
