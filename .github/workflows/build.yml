name: Build Anna's Diary

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter platform skeleton
        run: |
          rm -rf /tmp/agenda_base
          flutter create --project-name agenda_per_anna --org com.riccardopinato --platforms=android,web,ios /tmp/agenda_base
          cp -R /tmp/agenda_base/android .
          cp -R /tmp/agenda_base/web .
          cp -R /tmp/agenda_base/ios .

      - name: Configure Firebase Android when available
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          source = Path("firebase/google-services.json")
          if not source.exists():
              print("Firebase Android config not present; push stays disabled.")
              raise SystemExit(0)

          target = Path("android/app/google-services.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(source, target)

          settings = Path("android/settings.gradle.kts")
          s = settings.read_text()
          plugin_line = '    id("com.google.gms.google-services") version "4.4.4" apply false\n'
          if 'com.google.gms.google-services' not in s:
              marker = "plugins {\n"
              if marker not in s:
                  raise SystemExit("Android settings plugins block not found")
              s = s.replace(marker, marker + plugin_line, 1)
          settings.write_text(s)

          app = Path("android/app/build.gradle.kts")
          a = app.read_text()
          plugin_line = '    id("com.google.gms.google-services")\n'
          if 'com.google.gms.google-services' not in a:
              marker = "plugins {\n"
              if marker not in a:
                  raise SystemExit("Android app plugins block not found")
              a = a.replace(marker, marker + plugin_line, 1)
          app.write_text(a)

          Path(".firebase_enabled").write_text("1")
          print("Firebase Android config enabled.")
          PY

      - name: Configure Android activity for local authentication
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/kotlin/com/riccardopinato/agenda_per_anna/MainActivity.kt")
          s = p.read_text()
          s = s.replace("FlutterActivity", "FlutterFragmentActivity")
          s = s.replace(
              "import io.flutter.embedding.android.FlutterFragmentActivity",
              "import io.flutter.embedding.android.FlutterFragmentActivity",
          )
          if "FlutterFragmentActivity" in s and "import io.flutter.embedding.android.FlutterActivity" in s:
              s = s.replace(
                  "import io.flutter.embedding.android.FlutterActivity",
                  "import io.flutter.embedding.android.FlutterFragmentActivity",
              )
          p.write_text(s)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          m = manifest.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.USE_BIOMETRIC" />',
              '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
              '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
          ]
          pos = m.find(">")
          for permission in permissions:
              if permission not in m:
                  m = m[:pos+1] + "\n    " + permission + m[pos+1:]
                  pos = m.find(">")

          receiver_block = '''
                  <receiver
                      android:exported="false"
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver
                      android:exported="false"
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
          '''
          if "ScheduledNotificationReceiver" not in m:
              m = m.replace("</application>", receiver_block + "\n    </application>")

          m = m.replace(
              'android:label="agenda_per_anna"',
              'android:label="Anna\'s Diary"',
          )
          manifest.write_text(m)

          drawable = Path("android/app/src/main/res/drawable")
          drawable.mkdir(parents=True, exist_ok=True)
          (drawable / "notification_icon.xml").write_text("""<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M12,22c1.1,0 2,-0.9 2,-2h-4c0,1.1 0.9,2 2,2zM18,16v-5c0,-3.07 -1.63,-5.64 -4.5,-6.32V3c0,-0.83 -0.67,-1.5 -1.5,-1.5S10.5,2.17 10.5,3v0.68C7.64,4.36 6,6.92 6,10v6l-2,2v1h16v-1l-2,-2z" />
          </vector>""")

          plist = Path("ios/Runner/Info.plist")
          ptext = plist.read_text()
          if "NSFaceIDUsageDescription" not in ptext:
              ptext = ptext.replace(
                  "</dict>",
                  "    <key>NSFaceIDUsageDescription</key>\n"
                  "    <string>Usa Face ID per sbloccare Anna's Diary.</string>\n"
                  "</dict>",
                  1,
              )
          if "NSPhotoLibraryUsageDescription" not in ptext:
              ptext = ptext.replace(
                  "</dict>",
                  "    <key>NSPhotoLibraryUsageDescription</key>\n"
                  "    <string>Consenti ad Anna's Diary di scegliere foto per il tuo diario personale.</string>\n"
                  "</dict>",
                  1,
              )
          if "NSCameraUsageDescription" not in ptext:
              ptext = ptext.replace(
                  "</dict>",
                  "    <key>NSCameraUsageDescription</key>\n"
                  "    <string>Consenti ad Anna's Diary di scattare foto per il tuo diario personale.</string>\n"
                  "</dict>",
                  1,
              )
          ptext = ptext.replace(
              "<string>Agenda Per Anna</string>",
              "<string>Anna's Diary</string>",
          )
          ptext = ptext.replace(
              "<string>agenda_per_anna</string>",
              "<string>Anna's Diary</string>",
          )
          plist.write_text(ptext)
          PY

      - name: Restore project signing keystore
        uses: actions/cache@v5
        with:
          path: .signing/agenda-debug.jks
          key: agenda-per-anna-project-signing-v1

      - name: Create project signing keystore if missing
        run: |
          mkdir -p .signing
          if [ ! -f .signing/agenda-debug.jks ]; then
            keytool -genkeypair -v               -keystore .signing/agenda-debug.jks               -storepass android               -keypass android               -alias androiddebugkey               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configure project release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          block = '''
              signingConfigs {
                  create("agendaStable") {
                      storeFile = file("../../.signing/agenda-debug.jks")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
          '''

          marker = "    buildTypes {"
          if 'create("agendaStable")' not in s:
              if marker not in s:
                  raise SystemExit("buildTypes block not found")
              s = s.replace(marker, block + "\n" + marker, 1)

          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("agendaStable")'
          )

          p.write_text(s)
          PY

      - name: Enable Android core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          needle = "compileOptions {"
          if needle not in s:
              raise SystemExit("compileOptions block not found")
          s = s.replace(
              needle,
              needle + "\n        isCoreLibraryDesugaringEnabled = true",
              1,
          )
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' not in s:
              s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          p.write_text(s)
          PY

      - name: Decode app icon
        run: |
          mkdir -p assets/icon
          base64 -d assets/icon/app_icon.b64 > assets/icon/app_icon.jpg

      - name: Adjust icon config path
        run: |
          sed -i 's#assets/icon/app_icon.png#assets/icon/app_icon.jpg#g' pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android APK
        run: |
          FIREBASE_ARG=""
          if [ -f .firebase_enabled ]; then
            FIREBASE_ARG="--dart-define=FIREBASE_ENABLED=true"
          fi
          flutter build apk --release $FIREBASE_ARG
          flutter build apk --release --split-per-abi $FIREBASE_ARG

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: annas-diary-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload signing key backup
        uses: actions/upload-artifact@v4
        with:
          name: agenda-per-anna-signing-keystore
          path: .signing/agenda-debug.jks
          retention-days: 90
