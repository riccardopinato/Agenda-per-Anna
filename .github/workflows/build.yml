name: Build Anna's Diary Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Generate pinned Android platform
        run: |
          rm -rf android /tmp/agenda_android
          flutter create             --project-name agenda_per_anna             --org com.riccardopinato             --platforms=android             /tmp/agenda_android
          cp -R /tmp/agenda_android/android .

      - name: Apply deterministic Android configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/.signing/agenda-release.jks
        run: python3 tool/prepare_android_platform.py --release-signing

      - name: Verify release keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/.signing/agenda-release.jks
        run: |
          keytool -list             -keystore "$ANDROID_KEYSTORE_PATH"             -storepass "$ANDROID_KEYSTORE_PASSWORD"             -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons -f tool/flutter_launcher_icons_android.yaml

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build signed Android releases
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/.signing/agenda-release.jks
        run: |
          set -euo pipefail
          FIREBASE_ARG=""
          if [ -f android/app/google-services.json ]; then
            FIREBASE_ARG="--dart-define=FIREBASE_ENABLED=true"
          fi

          COMMON_ARGS=(
            --release
            --obfuscate
            --tree-shake-icons
            --split-debug-info=build/symbols
          )

          flutter build apk "${COMMON_ARGS[@]}" $FIREBASE_ARG
          cp build/app/outputs/flutter-apk/app-release.apk             build/app/outputs/flutter-apk/app-universal-release.apk

          flutter build apk             "${COMMON_ARGS[@]}"             --split-per-abi             $FIREBASE_ARG

          flutter build appbundle             "${COMMON_ARGS[@]}"             $FIREBASE_ARG

      - name: Name release outputs and create size reports
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          SAFE_VERSION=$(printf '%s' "$VERSION" | tr '+' '-')
          OUT=build/release-artifacts
          mkdir -p "$OUT"

          cp build/app/outputs/flutter-apk/app-universal-release.apk             "$OUT/annas-diary-v${SAFE_VERSION}-universal.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk             "$OUT/annas-diary-v${SAFE_VERSION}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk             "$OUT/annas-diary-v${SAFE_VERSION}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk             "$OUT/annas-diary-v${SAFE_VERSION}-x86_64.apk"
          cp build/app/outputs/bundle/release/app-release.aab             "$OUT/annas-diary-v${SAFE_VERSION}.aab"

          python3 tool/android_size_report.py             "$OUT/annas-diary-v${SAFE_VERSION}-arm64-v8a.apk"             --output "$OUT/size-arm64.txt"
          python3 tool/android_size_report.py             "$OUT/annas-diary-v${SAFE_VERSION}-universal.apk"             --output "$OUT/size-universal.txt"

          sha256sum "$OUT"/*.apk "$OUT"/*.aab > "$OUT/SHA256SUMS.txt"
          ls -lh "$OUT"

      - name: Upload preferred ARM64 sideload APK
        uses: actions/upload-artifact@v4
        with:
          name: annas-diary-arm64
          path: build/release-artifacts/*-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: annas-diary-play-aab
          path: build/release-artifacts/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload universal compatibility APK
        uses: actions/upload-artifact@v4
        with:
          name: annas-diary-universal
          path: build/release-artifacts/*-universal.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload legacy ABI APKs
        uses: actions/upload-artifact@v4
        with:
          name: annas-diary-other-abis
          path: |
            build/release-artifacts/*-armeabi-v7a.apk
            build/release-artifacts/*-x86_64.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload size and checksum report
        uses: actions/upload-artifact@v4
        with:
          name: annas-diary-release-report
          path: |
            build/release-artifacts/size-*.txt
            build/release-artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload obfuscation symbols
        uses: actions/upload-artifact@v4
        with:
          name: annas-diary-symbols
          path: build/symbols/**
          if-no-files-found: error
          retention-days: 90
