name: Resolve v0.32 lockfile

on:
  push:
    branches: [v0.32-data-safety-local-storage]
    paths:
      - "pubspec.yaml"
      - ".github/workflows/resolve-v032-lock.yml"

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Commit resolved lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          if git diff --cached --quiet; then
            echo "Lockfile already current."
          else
            git commit -m "Resolve v0.32 storage dependency lock"
            git push
          fi
