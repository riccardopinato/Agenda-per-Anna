name: Resolve v0.32 lockfile

on:
  push:
    branches: [v0.32-data-safety-local-storage]
    paths:
      - "pubspec.yaml"
      - ".github/workflows/resolve-v032-lock.yml"

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: v032-pubspec-lock
          path: pubspec.lock
