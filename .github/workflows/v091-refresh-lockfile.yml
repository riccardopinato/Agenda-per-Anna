name: v0.91 refresh lockfile

on:
  push:
    branches: [v091-premium-store-foundation]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v091-premium-store-foundation

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Refresh lockfile
        run: flutter pub get

      - name: Commit lockfile
        run: |
          if git diff --quiet -- pubspec.lock; then
            echo "pubspec.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "chore: refresh lockfile for RevenueCat [skip ci]"
          git push origin HEAD:v091-premium-store-foundation
