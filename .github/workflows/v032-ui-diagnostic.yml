name: v0.32 UI diagnostic

on:
  push:
    branches: [v0.32-data-safety-local-storage]
    paths:
      - ".github/workflows/v032-ui-diagnostic.yml"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Prepare icon asset
        run: |
          mkdir -p assets/icon
          base64 -d assets/icon/app_icon.b64 > assets/icon/app_icon.jpg
          sed -i 's#assets/icon/app_icon.png#assets/icon/app_icon.jpg#g' pubspec.yaml
      - run: flutter pub get --enforce-lockfile
      - name: Write diagnostic widget test
        run: |
          cat > test/_v032_ui_diag_test.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:agenda_per_anna/main.dart';

          void main() {
            TestWidgetsFlutterBinding.ensureInitialized();

            testWidgets('private composer diagnostic', (tester) async {
              SharedPreferences.setMockInitialValues({});
              print('DIAG private: before store');
              final store = AgendaStore();
              print('DIAG private: before load');
              await store.load().timeout(const Duration(seconds: 15));
              print('DIAG private: after load');
              await tester.pumpWidget(
                MaterialApp(
                  home: Scaffold(
                    body: DiaryMemoryCard(
                      store: store,
                      date: DateTime(2026, 9, 23),
                    ),
                  ),
                ),
              ).timeout(const Duration(seconds: 15));
              print('DIAG private: after pumpWidget');
              expect(find.byType(DiaryComposerSection), findsOneWidget);
              store.dispose();
              print('DIAG private: done');
            });
          }
          DART
      - name: Run diagnostic
        run: flutter test test/_v032_ui_diag_test.dart --reporter expanded
