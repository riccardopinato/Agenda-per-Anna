name: Deploy Anna's Diary Web
# v1.02 Release Reality: keep Web certification on the same exact PR head.

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "web_push/**"
      - "legal/**"
      - "tool/prepare_web_platform.py"
      - "tool/finalize_web_build.py"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "web_push/**"
      - "legal/**"
      - "tool/prepare_web_platform.py"
      - "tool/finalize_web_build.py"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: anna-diary-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Create pinned Flutter web platform
        run: |
          rm -rf /tmp/agenda_base
          flutter create --project-name agenda_per_anna --org com.riccardopinato --platforms=web --no-pub /tmp/agenda_base
          rm -rf web
          cp -R /tmp/agenda_base/web .
          python3 -m py_compile tool/prepare_web_platform.py
          python3 tool/prepare_web_platform.py

      - name: Decode app icon
        run: |
          mkdir -p assets/icon
          base64 -d assets/icon/app_icon.b64 > assets/icon/app_icon.jpg
          sed -i 's#assets/icon/app_icon.png#assets/icon/app_icon.jpg#g' pubspec.yaml

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build web preview
        run: >-
          flutter build web --release
          --base-href "/Agenda-per-Anna/"
          --dart-define=ANNA_STORE_RELEASE=false
          --dart-define=ANNA_PREMIUM_PREVIEW=true

      - name: Finalize Flutter service worker with Web Push
        run: |
          python3 -m py_compile tool/finalize_web_build.py
          python3 tool/finalize_web_build.py

      - name: Add public legal pages
        run: |
          cp legal/privacy.html build/web/privacy.html
          cp legal/terms.html build/web/terms.html
          cp legal/delete-account.html build/web/delete-account.html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
