name: v0.32 test matrix

on:
  push:
    branches: [v0.32-data-safety-local-storage]
    paths:
      - ".github/workflows/v032-test-matrix.yml"

jobs:
  test-file:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        file:
          - test/backup_test.dart
          - test/cloud_sync_queue_test.dart
          - test/diary_parity_components_test.dart
          - test/local_state_store_test.dart
          - test/preferences_test.dart
          - test/privacy_inbox_test.dart
          - test/reliability_test.dart
          - test/shared_diary_parity_test.dart
          - test/shared_space_test.dart
          - test/stability_performance_test.dart
          - test/unified_agenda_test.dart
          - test/widget_test.dart
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Prepare icon asset
        run: |
          mkdir -p assets/icon
          base64 -d assets/icon/app_icon.b64 > assets/icon/app_icon.jpg
          sed -i 's#assets/icon/app_icon.png#assets/icon/app_icon.jpg#g' pubspec.yaml
      - run: flutter pub get --enforce-lockfile
      - name: Test file
        run: flutter test ${{ matrix.file }} --reporter compact
