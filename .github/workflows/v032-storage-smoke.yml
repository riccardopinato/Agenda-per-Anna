name: v0.32 storage smoke

on:
  push:
    branches: [v0.32-data-safety-local-storage]
    paths:
      - ".github/workflows/v032-storage-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Prepare icon asset
        run: |
          mkdir -p assets/icon
          base64 -d assets/icon/app_icon.b64 > assets/icon/app_icon.jpg
          sed -i 's#assets/icon/app_icon.png#assets/icon/app_icon.jpg#g' pubspec.yaml
      - run: flutter pub get --enforce-lockfile
      - name: Run storage migration and regression tests
        run: |
          flutter test test/local_state_store_test.dart --reporter compact
          flutter test test/reliability_test.dart --reporter compact
          flutter test test/stability_performance_test.dart --reporter compact
