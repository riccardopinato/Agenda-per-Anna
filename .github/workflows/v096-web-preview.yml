name: v0.96 Web Preview Distribution

on:
  push:
    branches:
      - v096-shared-ecosystem-core-consumer
    paths:
      - ".github/workflows/v096-web-preview.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: anna-v096-web-preview
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Create pinned Flutter web platform
        run: |
          rm -rf /tmp/agenda_base
          flutter create --project-name agenda_per_anna --org com.riccardopinato --platforms=web --no-pub /tmp/agenda_base
          rm -rf web
          cp -R /tmp/agenda_base/web .
          python3 -m py_compile tool/prepare_web_platform.py
          python3 tool/prepare_web_platform.py

      - name: Decode app icon
        run: |
          mkdir -p assets/icon
          base64 -d assets/icon/app_icon.b64 > assets/icon/app_icon.jpg
          sed -i 's#assets/icon/app_icon.png#assets/icon/app_icon.jpg#g' pubspec.yaml

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build latest v0.96 Web preview
        run: >-
          flutter build web --release
          --base-href "/Agenda-per-Anna/"
          --dart-define=ANNA_STORE_RELEASE=false
          --dart-define=ANNA_PREMIUM_PREVIEW=true

      - name: Finalize Web build
        run: |
          python3 -m py_compile tool/finalize_web_build.py
          python3 tool/finalize_web_build.py
          cp legal/privacy.html build/web/privacy.html
          cp legal/terms.html build/web/terms.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-v096-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/web

  deploy:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-v096-preview-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Show preview URL
        run: echo "Preview URL=${{ steps.deployment.outputs.page_url }}"
