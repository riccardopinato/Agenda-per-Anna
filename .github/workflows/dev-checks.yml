name: Development checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Create pinned platform skeletons
        run: |
          rm -rf android web /tmp/agenda_base
          flutter create             --project-name agenda_per_anna             --org com.riccardopinato             --platforms=android,web             /tmp/agenda_base
          cp -R /tmp/agenda_base/android .
          cp -R /tmp/agenda_base/web .

      - name: Apply and verify platform configuration
        run: |
          python3 -m py_compile             tool/prepare_android_platform.py             tool/prepare_web_platform.py             tool/finalize_web_build.py             tool/android_size_report.py
          python3 tool/prepare_android_platform.py
          python3 tool/prepare_web_platform.py

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons -f tool/flutter_launcher_icons_android.yaml

      - name: Format new Dart sources
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            BASE_REF="origin/${{ github.base_ref }}"
          else
            BASE_REF="${{ github.event.before }}"
            if [[ -z "$BASE_REF" || "$BASE_REF" =~ ^0+$ ]]; then
              git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
              BASE_REF="HEAD^"
            else
              git fetch --no-tags --depth=1 origin "$BASE_REF"
            fi
          fi

          mapfile -t NEW_DART_FILES < <(
            git diff --name-only --diff-filter=A "$BASE_REF" HEAD -- '*.dart'
          )
          if (( ${#NEW_DART_FILES[@]} > 0 )); then
            dart format "${NEW_DART_FILES[@]}"
            git diff --exit-code -- "${NEW_DART_FILES[@]}"
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Test Web Vault crypto and persisted unlock
        run: |
          flutter test --platform chrome \
            test/v087_web_vault_kdf_browser_test.dart \
            test/v088_web_vault_e2e_browser_test.dart

      - name: Build web release
        run: |
          flutter build web --release
          python3 tool/finalize_web_build.py

      - name: Build Android ARM64 release gate
        if: github.event_name != 'pull_request'
        run: |
          FIREBASE_ARG=""
          if [ -f android/app/google-services.json ]; then
            FIREBASE_ARG="--dart-define=FIREBASE_ENABLED=true"
          fi
          flutter build apk             --release             --split-per-abi             --tree-shake-icons             $FIREBASE_ARG
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
