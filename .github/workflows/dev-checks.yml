name: Development checks

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - ".github/workflows/dev-checks.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Create Flutter platform skeleton
        run: |
          rm -rf /tmp/agenda_base
          flutter create --project-name agenda_per_anna --org com.riccardopinato --platforms=android,web,ios /tmp/agenda_base
          cp -R /tmp/agenda_base/android .
          cp -R /tmp/agenda_base/web .
          cp -R /tmp/agenda_base/ios .

      - name: Prepare icon asset
        run: |
          mkdir -p assets/icon
          base64 -d assets/icon/app_icon.b64 > assets/icon/app_icon.jpg
          sed -i 's#assets/icon/app_icon.png#assets/icon/app_icon.jpg#g' pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Commit generated dependency lockfile
        run: |
          if [ -z "$(git status --porcelain -- pubspec.lock)" ]; then
            echo "pubspec.lock is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pubspec.lock
            git commit -m "Lock Flutter dependencies for v0.30.1"
            git push origin HEAD:main
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-warnings

      - name: Test
        run: flutter test
