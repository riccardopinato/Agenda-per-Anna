name: Development checks

on:
  push:
    branches: [main, v091-premium-store-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: development-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Create pinned platform skeletons
        run: |
          rm -rf android web /tmp/agenda_base
          flutter create             --project-name agenda_per_anna             --org com.riccardopinato             --platforms=android,web             /tmp/agenda_base
          cp -R /tmp/agenda_base/android .
          cp -R /tmp/agenda_base/web .

      - name: Apply and verify platform configuration
        run: |
          python3 -m py_compile             tool/prepare_android_platform.py             tool/prepare_web_platform.py             tool/finalize_web_build.py             tool/android_size_report.py
          python3 tool/prepare_android_platform.py
          python3 tool/prepare_web_platform.py

      - name: Install dependencies
        run: |
          if [ "$GITHUB_REF" = "refs/heads/v091-premium-store-foundation" ]; then
            flutter pub get
          else
            flutter pub get --enforce-lockfile
          fi

      - name: Commit v0.91 lockfile refresh
        if: github.ref == 'refs/heads/v091-premium-store-foundation' && github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet -- pubspec.lock; then
            echo "pubspec.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "chore: refresh lockfile for RevenueCat [skip ci]"
          git push origin HEAD:v091-premium-store-foundation

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons -f tool/flutter_launcher_icons_android.yaml

      - name: Format v0.40 modules
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/src/store_signals.dart \
            test/v040_persistence_torture_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Test Web Vault crypto
        run: flutter test --platform chrome test/v087_web_vault_kdf_browser_test.dart

      - name: Build web release
        run: |
          flutter build web --release
          python3 tool/finalize_web_build.py

      - name: Build Android ARM64 release gate
        if: github.event_name != 'pull_request'
        run: |
          FIREBASE_ARG=""
          if [ -f android/app/google-services.json ]; then
            FIREBASE_ARG="--dart-define=FIREBASE_ENABLED=true"
          fi
          flutter build apk             --release             --split-per-abi             --tree-shake-icons             $FIREBASE_ARG
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
