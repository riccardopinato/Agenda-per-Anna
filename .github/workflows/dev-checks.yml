name: Development checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Create pinned platform skeletons
        run: |
          rm -rf android web /tmp/agenda_base
          flutter create             --project-name agenda_per_anna             --org com.riccardopinato             --platforms=android,web             /tmp/agenda_base
          cp -R /tmp/agenda_base/android .
          cp -R /tmp/agenda_base/web .

      - name: Apply and verify platform configuration
        run: |
          python3 -m py_compile             tool/prepare_android_platform.py             tool/prepare_web_platform.py             tool/android_size_report.py
          python3 tool/prepare_android_platform.py
          python3 tool/prepare_web_platform.py

      - name: Apply and verify Android configuration
        if: ${{ false }}
        run: echo "superseded by combined platform preparation"
        run: |
          python3 -m py_compile             tool/prepare_android_platform.py             tool/android_size_report.py
          python3 tool/prepare_android_platform.py

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons -f tool/flutter_launcher_icons_android.yaml

      - name: Format v0.40 modules
        run: |
          dart format --output=none --set-exit-if-changed             lib/src/store_signals.dart             test/v040_persistence_torture_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web release
        run: flutter build web --release

      - name: Build Android ARM64 release gate
        run: |
          FIREBASE_ARG=""
          if [ -f android/app/google-services.json ]; then
            FIREBASE_ARG="--dart-define=FIREBASE_ENABLED=true"
          fi
          flutter build apk             --release             --split-per-abi             --tree-shake-icons             $FIREBASE_ARG
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
