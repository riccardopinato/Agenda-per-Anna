name: Build lightweight ARM64 sideload APK

# Signed APK generation is an explicit manual action only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: annas-diary-arm64-sideload
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/.signing/agenda-release.jks

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require stable Android signing configuration
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error title=Stable Android signing is not configured::Missing: ${missing[*]}. Run tool/setup_release_signing_windows.ps1 once from a Windows clone of the repository."
            exit 1
          fi


      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Generate pinned Android platform
        run: |
          rm -rf android /tmp/agenda_android
          flutter create --project-name agenda_per_anna --org com.riccardopinato --platforms=android /tmp/agenda_android
          cp -R /tmp/agenda_android/android .

      - name: Apply Android configuration
        run: python3 tool/prepare_android_platform.py --release-signing

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons -f tool/flutter_launcher_icons_android.yaml

      # Gradle setup restores dependencies and Gradle metadata, not task outputs
      # unless task caching is explicitly enabled; each job builds its own APK.
      - name: Cache Gradle for Android build
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Build lightweight ARM64 release APK
        shell: bash
        run: |
          set -euo pipefail
          FIREBASE_ARG=""
          if [ -f android/app/google-services.json ]; then
            FIREBASE_ARG="--dart-define=FIREBASE_ENABLED=true"
          fi

          flutter build apk \
            --release \
            --split-per-abi \
            --tree-shake-icons \
            --dart-define=ANNA_STORE_RELEASE=false \
            --dart-define=ANNA_PREMIUM_PREVIEW=true \
            $FIREBASE_ARG

      - name: Prepare direct-install APK
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          SAFE_VERSION=$(printf '%s' "$VERSION" | tr '+' '-')
          mkdir -p build/direct-apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "build/direct-apk/Anna-Diary-arm64-release.apk"
          ls -lh build/direct-apk/*.apk

      - name: Prepare physical certification identity
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          VERSION=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          CERT_DER="$RUNNER_TEMP/anna-signing/agenda-release-cert.der"
          mkdir -p "$(dirname "$CERT_DER")"
          keytool -exportcert \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -file "$CERT_DER"
          SIGNING_SHA256=$(sha256sum "$CERT_DER" | awk '{print toupper($1)}')
          python3 tool/create_physical_cert_manifest.py \
            --artifact build/direct-apk/Anna-Diary-arm64-release.apk \
            --output build/direct-apk/PHYSICAL_CERTIFICATION_MANIFEST.json \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --version "$VERSION" \
            --variant "arm64-v8a release non-store physical-certification candidate" \
            --signing-sha256 "$SIGNING_SHA256" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --channel "direct-sideload" \
            --project "Anna's Diary" \
            --source-ref "$GITHUB_REF_NAME" \
            --package-id "com.riccardopinato.agenda_per_anna" \
            --validation-level "ARTIFACT_BUILT"

      - name: Upload lightweight ARM64 APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: annas-diary-light-arm64
          path: |
            build/direct-apk/*.apk
            build/direct-apk/PHYSICAL_CERTIFICATION_MANIFEST.json
          if-no-files-found: error
          retention-days: 30
