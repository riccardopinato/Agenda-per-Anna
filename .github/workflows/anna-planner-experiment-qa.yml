# Temporary QA for the draft-only PR #376. No live data, secrets or release signing.
# Before any future merge, remove this one-off experimental workflow.
name: Anna Planner split — isolated parity and Android debug
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/anna-planner-experiment-qa.yml'
      - 'lib/main.dart'
      - 'lib/src/planner_*.dart'
      - 'test/**'
permissions:
  contents: read
concurrency:
  group: anna-planner-experiment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pixel-parity:
    if: >-
      github.event.pull_request.number == 376 &&
      github.head_ref == 'experiment/anna-planner-lossless-split-20261124' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout immutable main baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: baseline
          ref: 7f6a60ff883b664574e3b7404aea12295d5a392b
          persist-credentials: false
      - name: Checkout exact experimental PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: experiment
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert original Dart bytes are reconstructible
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          header = b"part of '../main.dart';\n\n"
          original = Path('baseline/lib/src/planner_views.dart').read_bytes()
          p = Path('experiment/lib/src/planner_views.dart').read_bytes()
          w = Path('experiment/lib/src/planner_week_views.dart').read_bytes()
          m = Path('experiment/lib/src/planner_month_year_views.dart').read_bytes()
          assert p.startswith(header) and w.startswith(header) and m.startswith(header)
          assert original == p + w[len(header):] + m[len(header):]
          print('PLANNER_SOURCE_LOSSLESS: PASS')
          PY
      - name: Setup pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Capture SAME synthetic Flutter fixtures on baseline and trial
        shell: bash
        run: |
          set -euo pipefail
          # The Year capture is QA-only and is copied to baseline without committing.
          cp experiment/test/planner_experiment_year_visual_capture_test.dart baseline/test/
          for tree in baseline experiment; do
            echo "::group::Visual capture ${tree}"
            (
              cd "${tree}"
              rm -rf android web
              flutter create --project-name agenda_per_anna --org com.riccardopinato --platforms=android,web "${RUNNER_TEMP}/anna_planner_${tree}"
              cp -R "${RUNNER_TEMP}/anna_planner_${tree}/android" .
              cp -R "${RUNNER_TEMP}/anna_planner_${tree}/web" .
              python3 tool/prepare_android_platform.py
              python3 tool/prepare_web_platform.py
              flutter pub get --enforce-lockfile
              mkdir -p test/fixtures
              cp "$(dirname "$(command -v flutter)")/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" test/fixtures/
              for populated in false true; do
                flutter test --update-goldens \
                  --dart-define=ANNA_CALENDAR_CAPTURE=true \
                  --dart-define=ANNA_CALENDAR_POPULATED="${populated}" \
                  test/calendar_notebook_visual_capture_test.dart
                flutter test --update-goldens \
                  --dart-define=ANNA_ORGANIC_CAPTURE=true \
                  --dart-define=ANNA_ORGANIC_POPULATED="${populated}" \
                  test/organic_pastel_visual_capture_test.dart
              done
              flutter test --update-goldens \
                --dart-define=ANNA_PLANNER_EXPERIMENT_YEAR_CAPTURE=true \
                test/planner_experiment_year_visual_capture_test.dart
            )
            echo '::endgroup::'
          done
      - name: Compare 19 actual rendered PNGs pixel for pixel
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, json, sys
          names = ["anna_calendar_notebook_month_empty_390.png","anna_calendar_notebook_month_populated_390.png","anna_calendar_notebook_month_agenda_empty_390.png","anna_calendar_notebook_month_agenda_populated_390.png","anna_calendar_notebook_week_empty_390.png","anna_calendar_notebook_week_populated_390.png","anna_calendar_notebook_week_days_empty_390.png","anna_calendar_notebook_week_days_populated_390.png","anna_calendar_hub_month_empty_390.png","anna_calendar_hub_month_populated_390.png","anna_calendar_hub_week_empty_390.png","anna_calendar_hub_week_populated_390.png","organic_pastel_today_390.png","organic_pastel_today_populated_390.png","organic_pastel_today_collapsed_390.png","organic_pastel_today_populated_collapsed_390.png","organic_commitments_premium_empty_390.png","organic_commitments_premium_populated_390.png","anna_planner_split_year_empty_390.png"]
          rows = []
          for name in names:
              a = Path('baseline/test/goldens') / name
              b = Path('experiment/test/goldens') / name
              if not a.is_file() or not b.is_file():
                  rows.append({'file': name, 'status': 'MISSING', 'baseline': a.is_file(), 'experiment': b.is_file()})
                  continue
              with Image.open(a) as first, Image.open(b) as second:
                  a_pixels = first.convert('RGBA')
                  b_pixels = second.convert('RGBA')
                  equal = a_pixels.size == b_pixels.size and a_pixels.tobytes() == b_pixels.tobytes()
                  rows.append({'file': name, 'status': 'IDENTICAL' if equal else 'DIFFERENT',
                               'size_a': first.size, 'size_b': second.size,
                               'sha256_a': hashlib.sha256(a.read_bytes()).hexdigest(),
                               'sha256_b': hashlib.sha256(b.read_bytes()).hexdigest()})
          report = {'baseline_sha': '7f6a60ff883b664574e3b7404aea12295d5a392b',
                    'candidate': '${{ github.event.pull_request.head.sha }}',
                    'total': len(rows), 'identical': sum(r['status']=='IDENTICAL' for r in rows), 'results': rows}
          Path('planner-parity-report.json').write_text(json.dumps(report, indent=2)+'\n')
          print('PLANNER_VISUAL_PARITY:', report['identical'], '/', report['total'])
          for row in rows:
              if row['status'] != 'IDENTICAL': print(row)
          if report['identical'] != report['total']: sys.exit(1)
          PY
      - name: Save temporary visual evidence for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: anna-planner-experiment-visual-parity-${{ github.event.pull_request.head.sha }}
          path: |
            planner-parity-report.json
            baseline/test/goldens/anna_calendar_*.png
            baseline/test/goldens/organic_pastel_today*.png
            baseline/test/goldens/organic_commitments_*.png
            baseline/test/goldens/anna_planner_split_year_empty_390.png
            experiment/test/goldens/anna_calendar_*.png
            experiment/test/goldens/organic_pastel_today*.png
            experiment/test/goldens/organic_commitments_*.png
            experiment/test/goldens/anna_planner_split_year_empty_390.png
          if-no-files-found: warn
          retention-days: 5

  android-debug-compile:
    if: >-
      github.event.pull_request.number == 376 &&
      github.head_ref == 'experiment/anna-planner-lossless-split-20261124' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact experimental PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Generate isolated Android platform and locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          flutter create --project-name agenda_per_anna --org com.riccardopinato --platforms=android "${RUNNER_TEMP}/anna_planner_debug_android"
          cp -R "${RUNNER_TEMP}/anna_planner_debug_android/android" .
          python3 tool/prepare_android_platform.py
          flutter pub get --enforce-lockfile
          dart run flutter_launcher_icons -f tool/flutter_launcher_icons_android.yaml
      - name: Compile disposable Android ARM64 debug APK (not signed for release)
        run: flutter build apk --debug --target-platform android-arm64
      - name: Assert debug output only; no release, no device, no upload
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-debug.apk
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          echo 'ANDROID_ISOLATED_DEBUG_COMPILE_PASS'
