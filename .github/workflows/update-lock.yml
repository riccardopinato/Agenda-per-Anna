name: Refresh Flutter lockfile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-lock.yml"

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Refresh lockfile
        run: flutter pub get
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
