name: v0.41 Canonical Format

on:
  push:
    branches: [v0.41-universal-identity-noi]
    paths:
      - ".github/workflows/v041-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.41-universal-identity-noi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Canonical Dart format
        run: |
          dart format             lib/src/auth/universal_auth_gate.dart             lib/cloud_sync_service.dart             test/v041_identity_invite_test.dart             test/widget_test.dart
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             lib/src/auth/universal_auth_gate.dart             lib/cloud_sync_service.dart             test/v041_identity_invite_test.dart             test/widget_test.dart
          git commit -m "style(v0.41): canonical dart format"
          git push origin HEAD:v0.41-universal-identity-noi
